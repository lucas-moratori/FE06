  <h1>Aplicando Folhas de Estilo no HTML</h1>

  <p>Assim como o HTML, o CSS não é realmente uma linguagem de programação. Também não é uma linguagem de marcação — é uma linguagem de folhas de estilo. Isso significa que o CSS permite aplicar estilos seletivamente a elementos em documentos HTML.</p>
